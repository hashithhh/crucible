[build-system]
requires = ["setuptools>=77"]   # 77+ for SPDX `license` strings
build-backend = "setuptools.build_meta"

[project]
name = "crucible-tokenizer"
version = "0.1.0"
description = "Byte-level BPE tokenizer written from scratch — Crucible Phase 1"
requires-python = ">=3.11"  # possessive quantifiers in re (ADR-0005)
dependencies = []          # stdlib only, deliberately
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "matplotlib>=3.8",
    "pytest-watcher>=0.6",
]

[tool.setuptools]
py-modules = ["tokenizer"]   # flat layout; don't let auto-discovery guess
packages = ["crucible"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

# `ptw` settings. The target test is passed on the command line by
# scripts/watch.ps1, not here: config runner_args and CLI args are appended,
# so a test id here would run on top of whatever you pass.
[tool.pytest-watcher]
now = true                      # run once at startup, before the first save
clear = true
# Only the implementation triggers a re-run. The leading `*` is required: on
# Windows, watchdog matches with POSIX rules, so `\` is not a separator and a
# bare "tokenizer.py" never matches the full event path.
patterns = ["*tokenizer.py"]
ignore_patterns = ["*.venv*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
